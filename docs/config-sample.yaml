# Sample somp config (~/.config/somp/config.yaml).
# Every field has a fail-closed default; only guard.model_host/model_port
# have NO default (server refuses ModelOnly without an endpoint, so inventing
# one would aim sandboxes at a wrong provider).

aiec:
  base_url: "http://127.0.0.1:8080"
  # key_file: /etc/somp/aiec.key   # alternative to AIEC_API_KEY env
  api_key_env: "AIEC_API_KEY"

session:
  image: "somp-guest"   # built by guest/build-guest.sh
  cpus: 2
  mem_mb: 1024
  disk_mb: 4096
  ttl_s: 82800          # < AIec MAX 86400s

guard:
  template: "model-only"   # kebab-case PolicyTemplate; model-only is the default
  # REQUIRED for model-only (server refuses ModelOnly without an endpoint).
  # `somp model preset muse-spark` writes opencode.ai:443 (catalog baseUrl
  # https://opencode.ai/zen/go/v1, openai-responses API, verified 2026-10-10).
  model_host: "opencode.ai"
  model_port: 443

srt:
  settings_path: "guest/srt-settings.json"

security:
  level: "strict"   # strict = Firecracker+Guard+srt; standard = Docker+Guard+srt (dev); off refuses governed work

# JEV bash gate: classified before every dispatch --command + session exec.
# Key via TYPESAFE_API_KEY env (SDK convention), NEVER baked into this file.
# `somp jev on` enables; unset key / unreachable / timeout = REFUSE.
jev:
  enabled: false
  model: "jev-latest"   # pin a version (e.g. jev-1.13.0) so thresholds stay stable
  threshold: 0.15       # refuse when p(destructive) exceeds this
  allow_ungoverned_bash: false
